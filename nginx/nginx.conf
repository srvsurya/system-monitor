events {
    worker_connections 1024;
}

http {
    upstream system_monitor {
        server app:8080;
    }

    server {
        listen 80;
        server_name _;          # Replace with your domain when you have one

        # Increase for WebSocket upgrades and large responses
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;

        # ── WebSocket support (your gorilla hub) ──
        location /api/v1/ws {
            proxy_pass http://system_monitor;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── All other routes → Go/Gin ──
        location / {
            proxy_pass http://system_monitor;
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}